services:
  bump-demo:
    image: python:3.12-slim
    container_name: bump-demo
    restart: unless-stopped
    working_dir: /home/ubuntu/.local/share/bump-demo/app
    command: python -m uvicorn bump_server.app:app --host 0.0.0.0 --port 8000
    read_only: true
    tmpfs:
      - /tmp:size=16m
    mem_limit: 384m
    environment:
      PYTHONPATH: /home/ubuntu/.local/share/bump-demo/app/.venv/lib/python3.12/site-packages
    env_file:
      - /home/ubuntu/.config/bump-demo/server.env
    volumes:
      - /home/ubuntu/.local/share/bump-demo/app:/home/ubuntu/.local/share/bump-demo/app:ro
      - /home/ubuntu/.local/share/bump-demo/data:/home/ubuntu/.local/share/bump-demo/data
    networks:
      - web

networks:
  web:
    external: true
